<!DOCTYPE html>
<html lang="en" style="background:#061524">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspberry Pi Wi-Fi Extender Setup</title>
  <meta name="description" content="A step-by-step guide to turning a Raspberry Pi into a Wi-Fi extender.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Background uses the image's own edge colours so the two blend together */
    html, body {
      height: 100%;
      background: #061524;
      background: linear-gradient(to bottom, #061524, #071726);
    }

    /* Centre the image both ways */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Show the whole image: never wider or taller than the screen */
    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 32px);
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <img src="image.png" alt="Raspberry Pi Wi-Fi Extender Setup: five nmcli steps to create the hotspot, list connections, enable auto-start, check the hotspot IP and verify it is active.">
  </main>
</body>
</html>
